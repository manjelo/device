<?xml version="1.0" encoding="UTF-8"?>
<!--
  RadioSim - front view. V4 geometry, V5 material pass, V5 proportion pass (approximate, not an exact replica).
  Positions: docs/visual-reference-front.md, as fractions of the front body (origin x 58, y 40).
  CONFIRMED drawn: body silhouette (item 1), finish (2), speaker grille (3), HARRIS word mark (5),
    MULTIBAND text (6), LCD (7), keypad housing (8), keypad 4 rows (9), key shape (10), battery block (12), battery seam (13).
  UNCERTAIN drawn: side dots beside grille (4), battery latch recess (14), key legend placement (11).
  V5 proportion pass (user request, after the Harris photo review):
  - Body narrowed from 260 to 224 units (centred on x 170), so the height-to-width ratio is about 2.55:1 (was 2.2:1).
    The published figures (234 x 64 x 43 mm with battery, unit model not stated) suggest a taller body still; not matched exactly.
  - Speaker grille is now an aligned field of 4 rows x 5 round holes (was a staggered pattern), following the Harris photo.
  - LCD window and bezel moved to the body centre. The LCD inset CSS fractions in app.css follow the new x.
  - Keypad layout is unchanged internally. The whole group is shifted by -5.2 units to centre it on the body.
  Decisions:
  - Rule 5 keypad: columns 1-3 use the telephone layout 1-9, star, 0, hash (Secondary-source legends).
    V5: keypad-clear (CLR) is column 4 row 1 and keypad-enter (ENT) is column 4 row 2 (moved up from rows 3 and 4).
    V5: column 4 rows 3 and 4 are preset keys, PRE + (keypad-preset-up) and PRE - (keypad-preset-down). They step the preset by one.
    Their placement is ASSUMED. The "+ PRE" legend comes from a photo crop; the "-" legend is from the user's request, not verified.
  - Power, volume and squelch are NOT on the front view. They are visible controls on the top view (V4 cleanup):
    no transparent hit targets remain here, so nothing on the front is clickable without a visible shape.
  - Hidden fn-1..fn-4 groups were removed (no source supports them), so no invisible control stays in the DOM.
  - Antenna and top connectors are not drawn here (spec items 15 and 16 belong to the top view).
  DEVIATIONS (documented in docs/visual-reference-front.md, Deviations):
  - Keypad housing enlarged from 109 to 176 units tall so each key hit cell is 44 x 44 (spec 0.19 of height cannot hold four 44-unit rows).
    Battery now runs from y 462 to 612 (about 26 percent of body height; spec 35 percent). Key faces are 36 x 30.
  Display contents are drawn by React (Lcd.tsx, HTML panel). The lcd-area rect marks location only.
  No raster images, external fonts, scripts, foreignObject, or external references.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="front-view" viewBox="0 0 340 630">
  <title>Front view</title>
  <!-- V5 material pass: gradients and shadows only. V5 proportion pass: body narrowed, grille and LCD recentred. -->
  <defs>
    <linearGradient id="f-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7a58"/>
      <stop offset="0.45" stop-color="#556347"/>
      <stop offset="1" stop-color="#434e38"/>
    </linearGradient>
    <linearGradient id="f-battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5c46"/>
      <stop offset="1" stop-color="#3b4634"/>
    </linearGradient>
    <linearGradient id="f-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5648"/>
      <stop offset="1" stop-color="#262b22"/>
    </linearGradient>
    <linearGradient id="f-lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37513d"/>
      <stop offset="1" stop-color="#27392b"/>
    </linearGradient>
    <linearGradient id="f-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d332a"/>
      <stop offset="1" stop-color="#1c2019"/>
    </linearGradient>
    <linearGradient id="f-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0e8"/>
      <stop offset="0.6" stop-color="#d3d7ca"/>
      <stop offset="1" stop-color="#b3b8aa"/>
    </linearGradient>
    <linearGradient id="f-key-inert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9beb0"/>
      <stop offset="1" stop-color="#959b8c"/>
    </linearGradient>
    <linearGradient id="f-grille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5543"/>
      <stop offset="1" stop-color="#3c4536"/>
    </linearGradient>
    <radialGradient id="f-hole" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a5144"/>
      <stop offset="1" stop-color="#161a13"/>
    </radialGradient>
    <filter id="f-drop" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="f-inset" x="-5%" y="-5%" width="110%" height="115%">
      <feComponentTransfer in="SourceAlpha" result="inv">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="inner"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner"/>
      </feMerge>
    </filter>
    <filter id="f-key-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    #front-view .body { fill: url(#f-body); stroke: #343c2b; stroke-width: 1.5; }
    #front-view .battery { fill: url(#f-battery); }
    #front-view .seam { fill: #2f3829; }
    #front-view .latch { fill: #20241d; }
    #front-view .grille-panel { fill: url(#f-grille); stroke: #343d2d; stroke-width: 1; }
    #front-view .grille-hole { fill: url(#f-hole); }
    #front-view .side-dot { fill: #1d221b; }
    #front-view .wordmark { font-family: sans-serif; font-weight: 700; fill: #ffffff; }
    #front-view .lcd-bezel { fill: url(#f-bezel); stroke: #1c211a; stroke-width: 1; }
    #front-view .lcd { fill: url(#f-lcd); stroke: #18201a; stroke-width: 1; }
    #front-view .keypad-well { fill: url(#f-well); stroke: #161a13; stroke-width: 1; }
    #front-view .key { fill: url(#f-key); stroke: #7d8375; stroke-width: 0.8; }
    #front-view .key-base { fill: #12150f; }
    #front-view .key-inert { fill: url(#f-key-inert); stroke: #6f7668; stroke-width: 0.8; }
    #front-view .key-label { font-family: sans-serif; font-size: 12px; font-weight: 600; fill: #1d2019; text-anchor: middle; dominant-baseline: central; }
    #front-view .small-label { font-family: sans-serif; font-size: 8px; font-weight: 600; fill: #1d2019; text-anchor: middle; dominant-baseline: central; }
    #front-view .micro-label { font-family: sans-serif; font-size: 6px; font-weight: 600; fill: #1d2019; text-anchor: middle; dominant-baseline: central; }
    #front-view .hit { fill: transparent; stroke: none; }
    #front-view .control { cursor: pointer; }
    #front-view .control:focus { outline: none; }
    #front-view .control:focus-visible .key { stroke: #ffffff; stroke-width: 2; }
    #front-view .key, #front-view .key-inert { filter: url(#f-key-shadow); }
    #front-view .control--active .key { fill: #aab1a0; }
  </style>

  <!-- Body: olive, small corner radius (about 8 units), taper over the upper third (y 40 to 229). Width 224 (x 58 to 282). -->
  <path class="body" filter="url(#f-drop)" d="M 74 40 H 266 Q 274 40 275.5 47.7 L 282 229 V 604 Q 282 612 274 612 H 66 Q 58 612 58 604 V 229 L 64.5 47.7 Q 66 40 74 40 Z"/>

  <!-- Speaker grille (CONFIRMED position). V5: aligned field of 4 rows x 5 round holes, following the Harris photo. Decorative. -->
  <g aria-hidden="true">
    <rect class="grille-panel" filter="url(#f-inset)" x="97" y="86" width="146" height="86" rx="6"/>
    <g class="grille-hole">
      <circle cx="117.5" cy="98" r="3.6"/>
      <circle cx="143.75" cy="98" r="3.6"/>
      <circle cx="170" cy="98" r="3.6"/>
      <circle cx="196.25" cy="98" r="3.6"/>
      <circle cx="222.5" cy="98" r="3.6"/>
      <circle cx="117.5" cy="118" r="3.6"/>
      <circle cx="143.75" cy="118" r="3.6"/>
      <circle cx="170" cy="118" r="3.6"/>
      <circle cx="196.25" cy="118" r="3.6"/>
      <circle cx="222.5" cy="118" r="3.6"/>
      <circle cx="117.5" cy="138" r="3.6"/>
      <circle cx="143.75" cy="138" r="3.6"/>
      <circle cx="170" cy="138" r="3.6"/>
      <circle cx="196.25" cy="138" r="3.6"/>
      <circle cx="222.5" cy="138" r="3.6"/>
      <circle cx="117.5" cy="158" r="3.6"/>
      <circle cx="143.75" cy="158" r="3.6"/>
      <circle cx="170" cy="158" r="3.6"/>
      <circle cx="196.25" cy="158" r="3.6"/>
      <circle cx="222.5" cy="158" r="3.6"/>
    </g>
  </g>

  <!-- UNCERTAIN (spec item 4): small dots beside the grille at y 0.19. Decorative. -->
  <g aria-hidden="true">
    <circle class="side-dot" cx="76" cy="148.7" r="2.5"/>
    <circle class="side-dot" cx="264" cy="148.7" r="2.5"/>
  </g>

  <!-- CONFIRMED (spec item 5): HARRIS word mark, x 0.14-0.36, baseline y 0.06. Decorative, no control. -->
  <text class="wordmark" x="76.4" y="74.3" font-size="11" textLength="57.2" lengthAdjust="spacingAndGlyphs" aria-hidden="true">HARRIS</text>
  <!-- CONFIRMED (spec item 6): MULTIBAND text, x 0.68-0.86, baseline y 0.27. Decorative, no control. -->
  <text class="wordmark" x="216.8" y="194.4" font-size="7.5" textLength="46.8" lengthAdjust="spacingAndGlyphs" aria-hidden="true">MULTIBAND</text>

  <!-- CONFIRMED (spec item 7): LCD bezel and window, centred on the body. Contents are drawn by React. -->
  <rect class="lcd-bezel" filter="url(#f-inset)" x="72.7" y="206.6" width="194.6" height="50.1" rx="5" aria-hidden="true"/>
  <rect id="lcd-area" data-control="lcd-area" class="lcd" filter="url(#f-inset)" x="77.7" y="211.6" width="184.6" height="40.1" rx="2"/>

  <!-- Keypad group: the housing and keys are shifted by -5.2 units to centre them on the narrower body. Hit cells keep 44 units. -->
  <g transform="translate(-5.2 0)">
    <!-- Keypad housing (CONFIRMED spec item 8): top y 0.42. Height enlarged to 176 (DEVIATION, see header). -->
    <rect class="keypad-well" filter="url(#f-inset)" x="86.8" y="280.2" width="176.8" height="176" rx="4" aria-hidden="true"/>

    <!-- Keypad: 4 columns and 4 rows. Each hit cell is 44.2 x 44 and the cells do not overlap. Keys 36 x 30 with a raised base. -->
    <!-- V5 layout: CLR is column 4 row 1 and ENT is column 4 row 2. Column 4 rows 3 and 4 are the preset keys. -->
    <!-- Preset keys: the "+" legend with a small "PRE" is from the museum photo crop. The "-" legend is not confirmed beyond the request. -->
    <g class="control" id="keypad-preset-up" data-control="keypad-preset-up" aria-label="Preset up">
      <rect class="hit" x="219.4" y="368.2" width="44.2" height="44"/>
      <rect class="key-base" x="223.5" y="377.2" width="36" height="30" rx="5"/>
      <rect class="key" x="223.5" y="375.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="241.5" y="386">+</text>
      <text class="micro-label" x="241.5" y="397">PRE</text>
    </g>
    <g class="control" id="keypad-preset-down" data-control="keypad-preset-down" aria-label="Preset down">
      <rect class="hit" x="219.4" y="412.2" width="44.2" height="44"/>
      <rect class="key-base" x="223.5" y="421.2" width="36" height="30" rx="5"/>
      <rect class="key" x="223.5" y="419.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="241.5" y="434.2">−</text>
    </g>

    <!-- Row 1 -->
    <g class="control" id="keypad-1" data-control="keypad-1" aria-label="Key 1">
      <rect class="hit" x="86.8" y="280.2" width="44.2" height="44"/>
      <rect class="key-base" x="90.9" y="289.2" width="36" height="30" rx="5"/>
      <rect class="key" x="90.9" y="287.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="108.9" y="302.2">1</text>
    </g>
    <g class="control" id="keypad-2" data-control="keypad-2" aria-label="Key 2">
      <rect class="hit" x="131" y="280.2" width="44.2" height="44"/>
      <rect class="key-base" x="135.1" y="289.2" width="36" height="30" rx="5"/>
      <rect class="key" x="135.1" y="287.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="153.1" y="302.2">2</text>
    </g>
    <g class="control" id="keypad-3" data-control="keypad-3" aria-label="Key 3">
      <rect class="hit" x="175.2" y="280.2" width="44.2" height="44"/>
      <rect class="key-base" x="179.3" y="289.2" width="36" height="30" rx="5"/>
      <rect class="key" x="179.3" y="287.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="197.3" y="302.2">3</text>
    </g>

    <!-- Row 2 -->
    <g class="control" id="keypad-4" data-control="keypad-4" aria-label="Key 4">
      <rect class="hit" x="86.8" y="324.2" width="44.2" height="44"/>
      <rect class="key-base" x="90.9" y="333.2" width="36" height="30" rx="5"/>
      <rect class="key" x="90.9" y="331.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="108.9" y="346.2">4</text>
    </g>
    <g class="control" id="keypad-5" data-control="keypad-5" aria-label="Key 5">
      <rect class="hit" x="131" y="324.2" width="44.2" height="44"/>
      <rect class="key-base" x="135.1" y="333.2" width="36" height="30" rx="5"/>
      <rect class="key" x="135.1" y="331.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="153.1" y="346.2">5</text>
    </g>
    <g class="control" id="keypad-6" data-control="keypad-6" aria-label="Key 6">
      <rect class="hit" x="175.2" y="324.2" width="44.2" height="44"/>
      <rect class="key-base" x="179.3" y="333.2" width="36" height="30" rx="5"/>
      <rect class="key" x="179.3" y="331.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="197.3" y="346.2">6</text>
    </g>

    <!-- Row 3 -->
    <g class="control" id="keypad-7" data-control="keypad-7" aria-label="Key 7">
      <rect class="hit" x="86.8" y="368.2" width="44.2" height="44"/>
      <rect class="key-base" x="90.9" y="377.2" width="36" height="30" rx="5"/>
      <rect class="key" x="90.9" y="375.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="108.9" y="390.2">7</text>
    </g>
    <g class="control" id="keypad-8" data-control="keypad-8" aria-label="Key 8">
      <rect class="hit" x="131" y="368.2" width="44.2" height="44"/>
      <rect class="key-base" x="135.1" y="377.2" width="36" height="30" rx="5"/>
      <rect class="key" x="135.1" y="375.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="153.1" y="390.2">8</text>
    </g>
    <g class="control" id="keypad-9" data-control="keypad-9" aria-label="Key 9">
      <rect class="hit" x="175.2" y="368.2" width="44.2" height="44"/>
      <rect class="key-base" x="179.3" y="377.2" width="36" height="30" rx="5"/>
      <rect class="key" x="179.3" y="375.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="197.3" y="390.2">9</text>
    </g>
    <!-- UNCERTAIN (spec item 11, rule 5): CLR legend and placement are not resolved in the photo. V5: moved to column 4 row 1. -->
    <g class="control" id="keypad-clear" data-control="keypad-clear" aria-label="Clear">
      <rect class="hit" x="219.4" y="280.2" width="44.2" height="44"/>
      <rect class="key-base" x="223.5" y="289.2" width="36" height="30" rx="5"/>
      <rect class="key" x="223.5" y="287.2" width="36" height="30" rx="5"/>
      <text class="small-label" x="241.5" y="302.2">CLR</text>
    </g>

    <!-- Row 4 -->
    <g class="control" id="keypad-star" data-control="keypad-star" aria-label="Key star">
      <rect class="hit" x="86.8" y="412.2" width="44.2" height="44"/>
      <rect class="key-base" x="90.9" y="421.2" width="36" height="30" rx="5"/>
      <rect class="key" x="90.9" y="419.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="108.9" y="434.2">*</text>
    </g>
    <g class="control" id="keypad-0" data-control="keypad-0" aria-label="Key 0">
      <rect class="hit" x="131" y="412.2" width="44.2" height="44"/>
      <rect class="key-base" x="135.1" y="421.2" width="36" height="30" rx="5"/>
      <rect class="key" x="135.1" y="419.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="153.1" y="434.2">0</text>
    </g>
    <g class="control" id="keypad-hash" data-control="keypad-hash" aria-label="Key hash">
      <rect class="hit" x="175.2" y="412.2" width="44.2" height="44"/>
      <rect class="key-base" x="179.3" y="421.2" width="36" height="30" rx="5"/>
      <rect class="key" x="179.3" y="419.2" width="36" height="30" rx="5"/>
      <text class="key-label" x="197.3" y="434.2">#</text>
    </g>
    <!-- UNCERTAIN (spec item 11, rule 5): ENT legend and placement are not resolved in the photo. V5: moved to column 4 row 2. -->
    <g class="control" id="keypad-enter" data-control="keypad-enter" aria-label="Enter">
      <rect class="hit" x="219.4" y="324.2" width="44.2" height="44"/>
      <rect class="key-base" x="223.5" y="333.2" width="36" height="30" rx="5"/>
      <rect class="key" x="223.5" y="331.2" width="36" height="30" rx="5"/>
      <text class="small-label" x="241.5" y="346.2">ENT</text>
    </g>
  </g>

  <!-- Battery block (CONFIRMED spec item 12): full body width, y 462-612 (DEVIATION, see header). Follows the narrower body. -->
  <rect class="seam" x="58" y="459" width="224" height="3" aria-hidden="true"/>
  <path class="battery" d="M 58 462 H 282 V 604 Q 282 612 274 612 H 66 Q 58 612 58 604 Z" aria-hidden="true"/>
  <!-- UNCERTAIN (spec item 14): dark latch recess, just inside the battery top. Drawn as the simplest shape. -->
  <rect class="latch" x="93.3" y="464" width="153.4" height="15" rx="2" aria-hidden="true"/>

  <!-- SIM MODEL badge removed: not on the radio (spec item 19). -->
</svg>
