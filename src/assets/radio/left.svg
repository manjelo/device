<?xml version="1.0" encoding="UTF-8"?>
<!--
  RadioSim - left view (side elevation, approximation). V5 material and structure pass.
  Depth: the body is 104 units deep. On the front view's scale (572 units for about 234 mm, so about 2.44 units per mm) that is about 43 mm, matching the published depth with battery (unit model not stated).
  ASSUMED: PTT (push-to-talk) switch at the upper front-left, as a black protrusion. Consistent with the
    black protrusion in the Cryptologic Museum photo, but not confirmed as PTT (accuracy Unknown in controls.md).
  ASSUMED: battery pack sits slightly proud of the body at the bottom (about 6 units each side).
  UNCERTAIN: the battery latch and the top cap seam are drawn as simple shapes. Not confirmed from the photos.
  PTT is simulated only; no audio or RF is involved.
  Visual styling uses CSS classes. No raster images, fonts, or scripts.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="left-view" viewBox="0 0 340 630">
  <title>Left view</title>
  <defs>
    <linearGradient id="left-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4247"/>
      <stop offset="0.25" stop-color="#6b7078"/>
      <stop offset="0.5" stop-color="#8a8e95"/>
      <stop offset="0.8" stop-color="#5d6168"/>
      <stop offset="1" stop-color="#32353a"/>
    </linearGradient>
    <linearGradient id="left-battery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e3238"/>
      <stop offset="0.5" stop-color="#4b5058"/>
      <stop offset="1" stop-color="#2a2d32"/>
    </linearGradient>
    <linearGradient id="left-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececea"/>
      <stop offset="1" stop-color="#c4c4c0"/>
    </linearGradient>
    <linearGradient id="left-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#c8cbcf"/>
    </linearGradient>
    <linearGradient id="left-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e33"/>
      <stop offset="1" stop-color="#3d4046"/>
    </linearGradient>
    <linearGradient id="left-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25282c"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="left-antenna" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4d53"/>
      <stop offset="0.5" stop-color="#2a2c30"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </linearGradient>
    <linearGradient id="left-switch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c9097"/>
      <stop offset="1" stop-color="#4d5157"/>
    </linearGradient>
    <radialGradient id="left-knob" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c3c7cc"/>
      <stop offset="0.7" stop-color="#7d8187"/>
      <stop offset="1" stop-color="#4c5056"/>
    </radialGradient>
    <radialGradient id="left-button" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d9dcdf"/>
      <stop offset="1" stop-color="#5d6167"/>
    </radialGradient>
    <radialGradient id="left-connector" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b3b7bc"/>
      <stop offset="1" stop-color="#4f535a"/>
    </radialGradient>
    <pattern id="left-texture" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#ffffff" fill-opacity="0.07"/>
      <circle cx="4.5" cy="4.5" r="0.6" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <pattern id="left-grille" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2a2c30"/>
      <circle cx="3" cy="3" r="1.6" fill="#0f1012"/>
      <circle cx="2.4" cy="2.4" r="0.5" fill="#ffffff" fill-opacity="0.15"/>
    </pattern>
    <filter id="left-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="left-drop" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="left-inset" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer in="SourceAlpha" result="inv">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.7"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="inner"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    #left-view .body { fill: url(#left-body); stroke: #2b2e33; stroke-width: 2; }
    #left-view .battery { fill: url(#left-battery); stroke: #22252a; stroke-width: 1.5; }
    #left-view .seam { fill: #2a2d33; }
    #left-view .latch { fill: #1c1e21; stroke: #0b0c0e; stroke-width: 1; }
    #left-view .cap-seam { stroke: #2b2e33; stroke-width: 1.2; stroke-opacity: 0.7; fill: none; }
    #left-view .bevel { fill: none; stroke: #ffffff; stroke-opacity: 0.25; stroke-width: 1.5; }
    #left-view .texture { pointer-events: none; }
    #left-view .antenna { fill: url(#left-antenna); stroke: #111214; stroke-width: 1; }
    #left-view .grille { stroke: #111214; stroke-width: 1; }
    #left-view .lcd-bezel { fill: url(#left-bezel); stroke: #050607; stroke-width: 1.5; }
    #left-view .lcd { fill: #15191c; stroke: #000000; stroke-width: 1; }
    #left-view .keypad-well { fill: url(#left-well); stroke: #15171a; stroke-width: 1.5; }
    #left-view .key { fill: url(#left-key); stroke: #ffffff; stroke-opacity: 0.6; stroke-width: 1; }
    #left-view .key-base { fill: #5e6268; }
    #left-view .key-label { font-family: sans-serif; font-size: 18px; font-weight: 600; fill: #1d1f22; text-anchor: middle; dominant-baseline: central; }
    #left-view .small-label { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #1d1f22; text-anchor: middle; dominant-baseline: central; }
    #left-view .knob { fill: url(#left-knob); stroke: #22242a; stroke-width: 1.5; }
    #left-view .knob-ridge { stroke: #2a2c31; stroke-width: 1.2; stroke-opacity: 0.7; }
    #left-view .knob-mark { stroke: #f2f2f2; stroke-width: 2.5; stroke-linecap: round; }
    #left-view .button { fill: url(#left-button); stroke: #22242a; stroke-width: 1.5; }
    #left-view .power-icon { fill: none; stroke: #1d1f22; stroke-width: 2; stroke-linecap: round; }
    #left-view .switch { fill: url(#left-switch); stroke: #22242a; stroke-width: 1.5; }
    #left-view .switch-cap { fill: url(#left-key); stroke: #22242a; stroke-width: 1.2; }
    #left-view .connector { fill: url(#left-connector); stroke: #22242a; stroke-width: 1.5; }
    #left-view .connector-inner { fill: #1c1e21; }
    #left-view .label { fill: url(#left-plate); stroke: #8a8c8e; stroke-width: 1; }
    #left-view .label-text { font-family: sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px; fill: #3a3c40; text-anchor: middle; dominant-baseline: central; }
    #left-view .groove { stroke: #4a4e54; stroke-width: 2; stroke-linecap: round; }
    #left-view .hit { fill: transparent; }
    #left-view .control { cursor: pointer; }
    #left-view .control:focus { outline: none; }
    #left-view .control:focus-visible .key, #left-view .control:focus-visible .button, #left-view .control:focus-visible .knob, #left-view .control:focus-visible .switch-cap, #left-view .control:focus-visible .connector { stroke: #ffffff; stroke-width: 2.5; }
    #left-view .control--active .key { fill: #b9bdc2; }
    #left-view .control--active .knob, #left-view .control--active .button { fill: #9a9ea4; }
    #left-view .control--active .switch-cap, #left-view .control--active .connector { fill: #b0b4ba; }
  </style>

  <!-- Body: rounded shoulder at the top (radius about 36), squarer bottom where the battery attaches. Cylindrical side shading. -->
  <path class="body" filter="url(#left-drop)" d="M 154 40 H 186 Q 222 40 222 76 V 600 Q 222 606 216 606 H 124 Q 118 606 118 600 V 76 Q 118 40 154 40 Z"/>
  <rect class="bevel" x="126" y="48" width="88" height="550" rx="32"/>
  <rect class="texture" x="118" y="40" width="104" height="566" rx="40" fill="url(#left-texture)"/>
  <!-- Top cap seam (UNCERTAIN, decorative) -->
  <line class="cap-seam" x1="118" y1="70" x2="222" y2="70"/>
  <!-- Grip grooves (decorative) -->
  <line class="groove" x1="136" y1="400" x2="204" y2="400"/>
  <line class="groove" x1="136" y1="414" x2="204" y2="414"/>
  <line class="groove" x1="136" y1="428" x2="204" y2="428"/>

  <!-- Battery pack (ASSUMED: slightly proud of the body). Seam at its top edge. -->
  <rect class="seam" x="112" y="459" width="116" height="3" aria-hidden="true"/>
  <path class="battery" d="M 112 462 H 228 V 598 Q 228 612 214 612 H 126 Q 112 612 112 598 Z" aria-hidden="true"/>
  <!-- UNCERTAIN: battery latch recess, simple shape. -->
  <rect class="latch" x="150" y="470" width="40" height="12" rx="3" aria-hidden="true"/>

  <!-- ASSUMED: PTT switch, upper front-left, black protrusion (Cryptologic Museum photo). Position Unknown in controls.md. Simulated only. Hit area is 48 x 76 units. -->
  <g class="control" id="ptt" data-control="ptt" aria-label="Push to talk">
    <rect class="hit" x="88" y="110" width="48" height="76"/>
    <rect class="switch" x="116" y="118" width="10" height="60" rx="3"/>
    <rect class="switch-cap" x="100" y="120" width="18" height="56" rx="5" filter="url(#left-shadow)"/>
  </g>
</svg>
